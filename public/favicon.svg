<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#052e16" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#emeraldGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Subtle glow plate -->
  <circle cx="256" cy="265" r="170" fill="#10b981" fill-opacity="0.08" filter="url(#glow)" />

  <!-- Outer Cloche / Plate Rim -->
  <ellipse cx="256" cy="370" rx="160" ry="24" fill="#047857" fill-opacity="0.25" />
  <path d="M 110 368 C 110 360, 402 360, 402 368 C 402 376, 110 376, 110 368 Z" fill="url(#emeraldGrad)" />

  <!-- Chef Hat Base -->
  <g transform="translate(256, 260) scale(1.15)">
    <!-- Hat Bottom Band -->
    <path d="M -70 40 L 70 40 L 64 65 L -64 65 Z" fill="url(#goldGrad)" />
    <line x1="-50" y1="52" x2="50" y2="52" stroke="#78350f" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.5" />

    <!-- Hat Puffs -->
    <path d="M -68 38 
             C -90 15, -95 -25, -60 -45 
             C -65 -80, -25 -105, 0 -95 
             C 25 -105, 65 -80, 60 -45 
             C 95 -25, 90 15, 68 38 
             Z" 
          fill="#f8fafc" 
          stroke="#cbd5e1" 
          stroke-width="4" />

    <!-- Inner fold lines -->
    <path d="M -30 36 C -35 0, -32 -60, -18 -88" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
    <path d="M 0 36 C 0 0, 0 -65, 0 -92" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />
    <path d="M 30 36 C 35 0, 32 -60, 18 -88" fill="none" stroke="#e2e8f0" stroke-width="4" stroke-linecap="round" />

    <!-- Small Golden Star Emblem -->
    <circle cx="0" cy="52" r="7" fill="#fef08a" />
    <polygon points="0,47 2,51 7,52 3,55 4,59 0,56 -4,59 -3,55 -7,52 -2,51" fill="#b45309" />
  </g>

  <!-- Flame accent on top right -->
  <path d="M 345 155 C 335 125, 360 100, 355 85 C 375 105, 385 130, 370 150 C 390 135, 395 115, 400 105 C 410 130, 400 160, 380 175 C 365 185, 345 180, 345 155 Z" fill="url(#flameGrad)" />

  <!-- TaomUz text badge at bottom -->
  <rect x="156" y="415" width="200" height="42" rx="21" fill="#064e3b" stroke="url(#emeraldGrad)" stroke-width="2" />
  <text x="256" y="443" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#ecfdf5" text-anchor="middle" letter-spacing="1">TaomUz</text>
</svg>
